<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Шёпот — Люм</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="app">
    <header class="hero">
      <p class="eyebrow">Шёпот</p>
      <h1 id="greeting">Загрузка…</h1>
      <p class="sub" id="subtitle">Люм готовит пространство для вашей пары</p>
    </header>

    <section class="card" id="status-card">
      <h2>Статус</h2>
      <p id="status-text">Подключаюсь к API…</p>
    </section>

    <section class="card" id="profile-card" hidden>
      <h2>Портрет</h2>
      <p id="profile-summary" class="summary"></p>
      <p id="blocked-topics" class="muted"></p>
    </section>

    <section class="card" id="history-card" hidden>
      <h2>История квизов</h2>
      <ul id="history-list"></ul>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
